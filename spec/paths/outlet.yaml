outlet:
  get:
    operationId: profilOutlet
    tags: [Outlet]
    summary: Profil outlet
    description: |
      Publik, tanpa token (dipakai halaman depan website, halaman booking,
      layar masuk, dan nota). Token apa pun yang dikirim diabaikan, termasuk
      token yang tidak sah.
    security: []
    responses:
      '200':
        description: Profil outlet.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas/outlet.yaml#/Outlet'
            examples:
              terisi:
                $ref: '../components/examples/contoh.yaml#/Outlet'
              bawaan:
                $ref: '../components/examples/contoh.yaml#/OutletBawaan'
      '500':
        $ref: '../components/responses/galat.yaml#/InternalError'
  put:
    operationId: ubahOutlet
    tags: [Outlet]
    summary: Mengganti profil outlet
    description: |
      Khusus pemilik. Urutan: 413 → 400 → 401 → 403 → 422 → 200 dengan
      profil sesudah diubah. Perubahan langsung dipakai di website, halaman
      lacak, nota, dan pesan WhatsApp berikutnya.
    security:
      - tokenStaf: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/outlet.yaml#/UbahOutletRequest'
          example:
            name: Bengkel Maju Jaya
            tagline: Servis motor dan mobil, cepat dan jujur
            address: Jl. Merdeka No. 10, Bandung
            phone: 0812-9999-0000
            openingHours: Senin–Sabtu 08.00–17.00
            mapsUrl: https://maps.google.com/?q=-6.9175,107.6191
            receiptFooter: Garansi servis 7 hari.
    responses:
      '200':
        description: Profil sesudah diubah.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [data]
              properties:
                data:
                  $ref: '../components/schemas/outlet.yaml#/Outlet'
            examples:
              terisi:
                $ref: '../components/examples/contoh.yaml#/Outlet'
      '400':
        $ref: '../components/responses/galat.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/galat.yaml#/Unauthenticated'
      '403':
        $ref: '../components/responses/galat.yaml#/Forbidden'
      '413':
        $ref: '../components/responses/galat.yaml#/PayloadTooLarge'
      '422':
        $ref: '../components/responses/galat.yaml#/Unprocessable'
      '500':
        $ref: '../components/responses/galat.yaml#/InternalError'
